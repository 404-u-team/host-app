name: hostapp-staging

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hostapp}
      POSTGRES_USER: ${POSTGRES_USER:-hostapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for staging}
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: host-app-backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hostapp}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-hostapp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for staging}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-}
      JWT_ISSUER: ${JWT_ISSUER:-host-app}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-false}
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_SSL_ENABLED: ${SMTP_SSL_ENABLED:-false}
      SMTP_TLS_ENABLED: ${SMTP_TLS_ENABLED:-true}
    networks:
      database:
      intranet:
        aliases:
          - hostapp-staging-backend
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null http://localhost:8080/actuator/health && curl -fsS -o /dev/null http://localhost:8080/
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data_staging:

networks:
  database:
    internal: true
  intranet:
    external: true
    name: intranet
