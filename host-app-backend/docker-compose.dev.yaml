services:
  postgres:
    image: postgres:16-alpine
    container_name: hostapp-postgres-dev

    environment:
      POSTGRES_DB: hostapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "127.0.0.1:54500:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hostapp"]
      interval: 5s
      timeout: 3s
      retries: 20

    volumes:
      - postgres_data_hostapp_dev:/var/lib/postgresql/data

volumes:
  postgres_data_hostapp_dev:
