spring.datasource.url=jdbc:postgresql://localhost:54500/hostapp
spring.datasource.username=postgres
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Creates ADMIN once, without SMTP. Existing administrator credentials are preserved.
app.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}

# SMTP: implicit SSL (usually 465) or required STARTTLS (usually 587).
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLED:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_TLS_ENABLED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.email.from=${SMTP_FROM:}
app.email.verification-enabled=${EMAIL_VERIFICATION_ENABLED:false}
app.email.notifications-enabled=${EMAIL_NOTIFICATIONS_ENABLED:true}
