spring.datasource.url=jdbc:postgresql://localhost:54500/hostapp
spring.datasource.username=postgres
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
management.health.mail.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.jwt.issuer=${JWT_ISSUER:host-app}
app.jwt.access-minutes=${ACCESS_TOKEN_MINUTES:15}
app.jwt.refresh-days=${REFRESH_TOKEN_DAYS:14}
app.cookie.secure=${COOKIE_SECURE:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Creates ADMIN once, without SMTP. Existing administrator credentials are preserved.
app.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}

# SMTP: implicit SSL (usually 465) or required STARTTLS (usually 587).
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLED:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_TLS_ENABLED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.email.from=${SMTP_FROM:}
app.email.verification-enabled=${EMAIL_VERIFICATION_ENABLED:false}
app.email.notifications-enabled=${EMAIL_NOTIFICATIONS_ENABLED:true}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
